project:
  name: "ml-short-horizon-trading"

data:
  symbol: "BTCUSDT"
  market: "spot"

  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

  orderbook_levels: 5

  start_date: "2026-01-01"
  end_date: "2026-01-02"

target:
  horizon: 10
  threshold: 0.0001
  price_col: "mid_price"
  return_col: "future_return"
  target_col: "target"

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  purge_window: 10
  embargo_window: 0

validation:
  max_spread_bps: 100
  allow_missing: false