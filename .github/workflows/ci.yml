name: Quantitative ML Pipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] uvicorn httpx

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Generate Processed Dataset
        run: |
          python scripts/build_dataset.py --force

      - name: Evaluate ML Baseline Models
        run: |
          python scripts/evaluate_models.py

      - name: Execute Out-of-Sample Backtest
        run: |
          python scripts/run_backtest.py --fee 5.0 --slippage 1.0

      - name: Validate Docker Build
        run: |
          docker build -t ml-short-horizon-trading:ci -f docker/Dockerfile .
